<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审核后台 · openworld</title><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/game">[o] <span>openworld</span></a><p class="eyebrow">TOWN MANAGEMENT</p><h1>审核后台</h1><p class="muted">让每一份创造，成为世界的一部分。</p><nav aria-label="审核状态"><button data-status="pending" aria-pressed="true">◷ <span>待审核</span></button><button data-status="published" aria-pressed="false">✓ <span>已通过</span></button><button data-status="rejected" aria-pressed="false">↩ <span>已退回</span></button><button data-status="superseded" aria-pressed="false">▤ <span>历史版本</span></button></nav><div class="sidebar-bottom"><span class="avatar">T</span><div><strong id="identity">正在验证身份</strong><small>管理员 · GitHub</small></div></div><a class="back" href="/game">← 返回小镇</a></aside>
<main><header><div><p class="eyebrow">REVIEW STUDIO</p><h2 id="heading">待审核作品</h2></div><button id="refresh">↻ 刷新列表</button></header><p id="message" role="status" aria-live="polite">正在加载审核队列…</p>
<div class="studio"><section class="queue" aria-label="提交列表"><div class="queue-heading"><strong>提交列表</strong><span id="count">—</span></div><div id="list"></div><div class="pagination"><button id="previous" disabled>← 上一页</button><span id="page-number">01</span><button id="next" disabled>下一页 →</button></div></section>
<section class="detail"><div class="preview-wrap"><canvas id="preview" aria-label="模型预览，可拖动旋转和滚轮缩放"></canvas><div class="preview-top"><span class="badge">3D PREVIEW</span><button id="reset-view">重置视角</button></div><p id="preview-status">选择一份提交，开始查看</p><span class="preview-help">拖动旋转 · 滚轮缩放</span></div>
<div id="details" hidden><div class="detail-heading"><div><p class="eyebrow">SUBMISSION DETAILS</p><h3 id="plot-name"></h3></div><span id="status" class="badge"></span></div><p id="description" class="muted"></p><dl id="metadata"></dl><section id="review-record" hidden><h4>审核记录</h4><p id="record-text"></p></section>
<form id="review-form" hidden><label for="note">审核备注 <span class="muted">退回时必填</span></label><textarea id="note" rows="3" maxlength="500" placeholder="说明需要修改的地方，帮助作者完善作品…"></textarea><div class="review-footer"><span>通过后，模型将公开展示在小镇中。</span><div><button id="reject" type="button" disabled>退回修改</button><button id="approve" class="primary" type="submit" disabled>通过并公开 ↗</button></div></div></form></div></section></div></main>
</body></html>
